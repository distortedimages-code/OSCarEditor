# Builds and tests on GitHub's machines: no Mac or Windows tools needed locally.
# Push this folder to a GitHub repository, open the "Actions" tab, and download
# the artefacts of the latest run.
name: build

on:
  push:
    branches: [ "**" ]     # version tags are handled by release.yml
    paths-ignore: [ "docs/**", "tools/site/**" ]   # the web page doesn't need a build
  pull_request:
    paths-ignore: [ "docs/**", "tools/site/**" ]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: |
          mkdir -p out
          cd build/OSCarEditor_artefacts/Release
          for b in "AU/OXIde.component" "VST3/OXIde.vst3" "Standalone/OXIde.app"; do
            codesign --force --deep --sign - "$b"
          done
          ditto -c -k --keepParent "AU/OXIde.component" ../../../out/OXIde-AU-mac.zip
          ditto -c -k --keepParent "VST3/OXIde.vst3" ../../../out/OXIde-VST3-mac.zip
          ditto -c -k --keepParent "Standalone/OXIde.app" ../../../out/OXIde-App-mac.zip
      - name: Disk image
        run: |
          mkdir -p pkg
          ART=build/OSCarEditor_artefacts/Release
          cp -R "$ART/AU/OXIde.component" "$ART/VST3/OXIde.vst3" "$ART/Standalone/OXIde.app" pkg/
          python3 -m pip install --quiet --break-system-packages dmgbuild==1.6.7 || python3 -m pip install --quiet dmgbuild==1.6.7
          tools/dmg/make_dmg.sh pkg out/OXIde-mac.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: OXIde-mac
          path: |
            out/*.zip
            out/*.dmg

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: OXIde-windows
          path: |
            build/OSCarEditor_artefacts/Release/VST3
            build/OSCarEditor_artefacts/Release/Standalone
