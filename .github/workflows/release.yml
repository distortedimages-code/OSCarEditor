# Publishing a version: set VERSION in CMakeLists.txt, write RELEASE_NOTES.md, commit,
# then push a tag with the same number:  git tag v0.3.0 && git push origin v0.3.0
# This builds and tests on a Mac, and creates a DRAFT release with OSCar-Editor-mac.zip and
# its SHA-256. Review the notes on GitHub and press "Publish release": installed plugins
# then offer the update (they only see published, non-prerelease releases).
name: release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(sed -n 's/^project(OSCarEditor VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "$TAG" != "$VER" ]; then
            echo "The tag v$TAG doesn't match VERSION $VER in CMakeLists.txt"; exit 1
          fi

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          ART=build/OSCarEditor_artefacts/Release
          mkdir -p pkg out
          for b in "AU/OSCar Editor.component" "VST3/OSCar Editor.vst3" "Standalone/OSCar Editor.app"; do
            codesign --force --deep --sign - "$ART/$b"
            cp -R "$ART/$b" pkg/
          done
          # the three bundles at the top of the zip, as the in-plugin updater expects
          ditto -c -k pkg out/OSCar-Editor-mac.zip
          (cd out && shasum -a 256 OSCar-Editor-mac.zip > OSCar-Editor-mac.zip.sha256)

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=RELEASE_NOTES.md
          [ -f "$NOTES" ] || { echo "OSCar Editor ${GITHUB_REF_NAME#v}" > /tmp/notes.md; NOTES=/tmp/notes.md; }
          gh release create "$GITHUB_REF_NAME" out/OSCar-Editor-mac.zip out/OSCar-Editor-mac.zip.sha256 \
            --draft --title "OSCar Editor ${GITHUB_REF_NAME#v}" --notes-file "$NOTES"
