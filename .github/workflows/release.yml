# Publishing a version: set VERSION in CMakeLists.txt, write RELEASE_NOTES.md, commit, then
# either
#   - on GitHub: Actions > release > Run workflow (on main), or
#   - push a tag with the same number:  git tag v0.3.0 && git push origin v0.3.0
# This builds and tests on a Mac, and creates a DRAFT release v<VERSION> with
# OSCar-Editor-mac.dmg (for people), OSCar-Editor-mac.zip and its SHA-256 (for the in-plugin updater). Review the notes on GitHub and press "Publish release"
# (that also creates the tag when the workflow was run by hand): installed plugins then offer
# the update (they only see published, non-prerelease releases).
name: release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(sed -n 's/^project(OSCarEditor VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "$GITHUB_REF_TYPE" = "tag" ] && gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # publishing a release made by hand creates its tag, which lands here: nothing left to do
            echo "Release $GITHUB_REF_NAME already exists: nothing to build."
            echo "SKIP=1" >> "$GITHUB_ENV"; exit 0
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "${GITHUB_REF_NAME#v}" != "$VER" ]; then
              echo "The tag $GITHUB_REF_NAME doesn't match VERSION $VER in CMakeLists.txt"; exit 1
            fi
          elif gh release view "v$VER" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "A release v$VER already exists: raise VERSION in CMakeLists.txt first"; exit 1
          fi
          echo "VERSION=$VER" >> "$GITHUB_ENV"

      - name: Configure
        if: env.SKIP != '1'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        if: env.SKIP != '1'
        run: cmake --build build --config Release -j 4

      - name: Test
        if: env.SKIP != '1'
        run: ctest --test-dir build --output-on-failure

      - name: Package
        if: env.SKIP != '1'
        run: |
          ART=build/OSCarEditor_artefacts/Release
          mkdir -p pkg out
          for b in "AU/OSCar Editor.component" "VST3/OSCar Editor.vst3" "Standalone/OSCar Editor.app"; do
            codesign --force --deep --sign - "$ART/$b"
            cp -R "$ART/$b" pkg/
          done
          # the three bundles at the top of the zip, as the in-plugin updater expects
          ditto -c -k pkg out/OSCar-Editor-mac.zip
          (cd out && shasum -a 256 OSCar-Editor-mac.zip > OSCar-Editor-mac.zip.sha256)
          # the disk image people download from the web page
          python3 -m pip install --quiet --break-system-packages dmgbuild==1.6.7 || python3 -m pip install --quiet dmgbuild==1.6.7
          tools/dmg/make_dmg.sh pkg out/OSCar-Editor-mac.dmg

      - name: Create the draft release
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=RELEASE_NOTES.md
          [ -f "$NOTES" ] || { echo "OSCar Editor $VERSION" > /tmp/notes.md; NOTES=/tmp/notes.md; }
          # run by hand: the tag v$VERSION is created on this commit when the draft is published
          gh release create "v$VERSION" out/OSCar-Editor-mac.dmg out/OSCar-Editor-mac.zip out/OSCar-Editor-mac.zip.sha256 \
            --target "$GITHUB_SHA" --draft --title "OSCar Editor $VERSION" --notes-file "$NOTES"
